<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#202124">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>Foto uitsnijden</title>
</head>
<body>
  <header>
    <h1>Foto uitsnijden</h1>
    <label class="button">
      Foto kiezen
      <input id="fileInput" type="file" accept="image/*" hidden>
    </label>
  </header>

  <main>
    <section class="controls">
      <label>
        Verhouding
        <select id="ratioSelect">
          <option value="1">1:1</option>
          <option value="4/3">4:3</option>
          <option value="3/4">3:4</option>
          <option value="3/2">3:2</option>
          <option value="2/3">2:3</option>
          <option value="16/9">16:9</option>
          <option value="9/16">9:16</option>
          <option value="210/297" selected>A4 staand</option>
          <option value="297/210">A4 liggend</option>
          <option value="100/150">10 × 15 cm</option>
          <option value="150/100">15 × 10 cm</option>
        </select>
      </label>

      <label>
        Formaat op papier
        <select id="printSize">
          <option value="210x297">A4</option>
          <option value="150x100">10 × 15 cm</option>
          <option value="100x100">10 × 10 cm</option>
          <option value="200x200">20 × 20 cm</option>
          <option value="297x210">A4 liggend</option>
        </select>
      </label>

      <div class="sizeInfo" id="sizeInfo">Kies een foto.</div>
    </section>

    <section class="workspace">
      <div class="canvasWrap" id="canvasWrap">
        <canvas id="canvas"></canvas>
        <div class="cropFrame" id="cropFrame" aria-hidden="true">
          <div class="corner tl"></div><div class="corner tr"></div>
          <div class="corner bl"></div><div class="corner br"></div>
          <!-- <span>UITSNEDE GEBIED</span> -->
        </div>
      </div>
      <p class="hint">Sleep de foto. Gebruik twee vingers om in of uit te zoomen.</p>
    </section>

    <section class="actions">
      <button id="resetButton" disabled>Reset</button>
      <button id="downloadButton" disabled>Uitsnede opslaan</button>
      <button id="printButton" disabled>Printen</button>
    </section>
  </main>

  <script src="app.js"></script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");</script>
</body>
</html>
